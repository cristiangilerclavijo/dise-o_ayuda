<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyudaYa</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="screen screen--centered" style="display: block; padding-top: 0; padding-bottom: 0;">
        <div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: var(--space-lg) var(--space-md); padding-bottom: calc(var(--space-lg) + var(--nav-height));">
            <div style="display: grid; gap: var(--space-lg); max-width: 960px; margin: 0 auto; width: 100%;">
                <div>
                    <div style="display: flex; align-items: center; gap: var(--space-md); margin-bottom: var(--space-md);">
                        <img src="assets/images/logo-ayudaya.svg" alt="AyudaYa" style="width: 56px; height: 56px; object-fit: contain;">
                        <h1 style="font-size: var(--font-size-title); font-weight: 700; color: var(--color-text); margin: 0;">AyudaYa</h1>
                    </div>
                    <p style="font-size: var(--font-size-body); color: var(--color-text-muted); max-width: 520px; line-height: 1.6;">
                        Plataforma para reportar y gestionar necesidades comunitarias. Reportá baches, fallas de alumbrado o situaciones de inseguridad en tu barrio.
                    </p>
                </div>

                <div style="display: grid; gap: var(--space-sm); max-width: 320px;">
                    <a href="login.html" class="btn btn--primary" style="width: 100%;">Ver login</a>
                    <a href="reportes.html" class="btn btn--secondary" style="width: 100%;">Ver reportes</a>
                    <a href="crear-reporte.html" class="btn btn--secondary" style="width: 100%;">Crear reporte</a>
                </div>
            </div>
        </div>
    </main>

    <nav class="navbar" aria-label="Navegación principal">
        <a href="index.html" class="navbar__item navbar__item--active" aria-current="page">
            <span class="navbar__icon" aria-hidden="true">🏠</span>
            <span>Inicio</span>
        </a>
        <a href="reportes.html" class="navbar__item">
            <span class="navbar__icon" aria-hidden="true">📋</span>
            <span>Reportes</span>
        </a>
        <a href="crear-reporte.html" class="navbar__item">
            <span class="navbar__icon" aria-hidden="true">➕</span>
            <span>Crear</span>
        </a>
        <a href="login.html" class="navbar__item">
            <span class="navbar__icon" aria-hidden="true">👤</span>
            <span>Login</span>
        </a>
    </nav>
</body>
</html>
